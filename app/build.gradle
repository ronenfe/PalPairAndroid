plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'net.festinger.palpair'
    compileSdkVersion 36
    defaultConfig {
        applicationId "net.festinger.palpair"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 12
        versionName '7'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "region"
    productFlavors {
        global {
            dimension "region"
        }
        china {
            dimension "region"
            applicationIdSuffix ".china"
        }
    }

    // This block tells Android Studio which variant to select by default 
    // when you open the project or after a Gradle sync.
    productFlavors {
        global {
            isDefault = true
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}